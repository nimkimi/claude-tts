[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sonari"
version = "0.10.0"
description = "Eyes-free text-to-speech layer for Claude Code (macOS)"
requires-python = ">=3.9"
authors = [{ name = "Nima Hakimi", email = "hakimi.nima1@gmail.com" }]
license = { text = "MIT" }

[project.scripts]
sonari = "sonari.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
# Kokoro-82M neural voices (optional, cross-platform). One ~310 MB model + a 6 MB
# voices file (auto-downloaded on first use) provide all 28 voices. Imported lazily
# only when a Kokoro voice is selected, so base Sonari runs without these.
kokoro = [
    "kokoro-onnx>=0.3.0",
    "onnxruntime",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonari = ["assets/*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
